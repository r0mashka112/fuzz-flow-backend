[tool.poetry]
name = "fuzz-flow-backend"
version = "0.1.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "0.136.3"
uvicorn = {extras = ["standard"], version = ">=0.49.0,<0.50.0"}
sqlalchemy = "2.0.49"
alembic = "1.18.4"
asyncpg = "0.31.0"
psycopg2-binary = "2.9.12"
pydantic = "2.13.4"
pydantic-settings = "2.14.1"
python-dotenv = "1.2.2"
greenlet = "^3.5.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.16"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
]

ignore = [
    "E501",
    "W191"
]